    @keyframes slideInRight {

    /* Slide out to left */
    @keyframes slideOutLeft {
      from { transform: translateX(0); }

    /* Slide in from left (back) */
    @keyframes slideInLeft {
      from { transform: translateX(-28%); }

    @keyframes slideOutRight {
      from { transform: translateX(0); }

    @keyframes sheetUp {
      from { transform: translateY(100%); opacity: 0.6; }
      to   { transform: translateY(0);    opacity: 1; }

    /* Fade + scale (login → home) */
    @keyframes fadeScale {
      from { opacity: 0; transform: scale(0.96); }

    @keyframes fadeOut {

    // ══════════════════════════════════════════════════════════
    // RECEIPT COMPONENT — fiel ao comprovante real
    // ══════════════════════════════════════════════════════════
    function Receipt({tx, onClose, animClass}) {
      const r = tx.receipt;
      const isCredit = tx.type === "credit";
      const Row = ({label, value, bold=true}) => (
        <div style={{marginBottom:16}}>
          <div style={{color:"#666",fontSize:13,marginBottom:3}}>{label}</div>
          <div style={{color:"#111",fontSize:14,fontWeight:bold?700:400,wordBreak:"break-all"}}>{value}</div>
        </div>
      );
      return (
        <div style={{
          position:"fixed",inset:0,zIndex:200,
          background:"rgba(0,0,0,0.6)",
          display:"flex",flexDirection:"column",
          animation:"fadeIn 0.2s ease",
        }}>
          {/* Header bar */}
          <div style={{background:"#0a0a0a",padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
            <button onClick={onClose} style={{background:"none",border:"none",color:C.wh,fontSize:15,fontWeight:600,display:"flex",alignItems:"center",gap:6,padding:0}}>
              <Icon name="chL" size={22} color={C.wh}/> Fechar
            </button>
            <span style={{color:C.wh,fontSize:15,fontWeight:600}}>Comprovante</span>
            <button onClick={()=>{}} style={{background:"none",border:"none",padding:4}}>
              <Icon name="share" size={22} color={C.wh}/>
            </button>
          </div>

          {/* White receipt body — scrollable */}
          <div className="scroll-area" style={{flex:1,background:"#f5f5f5",overflowY:"auto",WebkitOverflowScrolling:"touch"}}>
            <div style={{background:"#fff",margin:"0",padding:"24px 20px 32px",minHeight:"100%"}}>

              {/* C6 Logo */}
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:28}}>
                <img src={C6_LOGO_URI} alt="C6 Bank" style={{width:36,height:36,borderRadius:8}}/>
                <div style={{display:"flex",alignItems:"baseline"}}>
                  <span style={{color:"#111",fontSize:22,fontWeight:900,fontFamily:"Georgia,serif",letterSpacing:-1}}>C6</span>
                  <span style={{color:"#111",fontSize:15,fontWeight:300,fontFamily:"Georgia,serif",letterSpacing:3,marginLeft:2}}>BANK</span>
                </div>
              </div>

              {/* Status timeline */}
              <div style={{display:"flex",alignItems:"flex-start",gap:0,marginBottom:28}}>
                {/* Step 1 */}
                <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6,minWidth:100}}>
                  <div style={{width:32,height:32,borderRadius:16,border:"2px solid #22c55e",display:"flex",alignItems:"center",justifyContent:"center"}}>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#22c55e" strokeWidth="3" strokeLinecap="round"><polyline points="20 6 9 17 4 12"/></svg>
                  </div>
                  <div style={{textAlign:"center"}}>
                    <div style={{color:"#111",fontSize:12,fontWeight:700}}>Pix em</div>
                    <div style={{color:"#111",fontSize:12,fontWeight:700}}>andamento</div>
                    <div style={{color:"#888",fontSize:11,marginTop:2}}>{r.datetimeShort}</div>
                  </div>
                </div>
                {/* Line */}
                <div style={{flex:1,height:2,background:"#22c55e",marginTop:15}}/>
                {/* Step 2 */}
                <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6,minWidth:100}}>
                  <div style={{width:32,height:32,borderRadius:16,border:"2px solid #22c55e",display:"flex",alignItems:"center",justifyContent:"center"}}>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#22c55e" strokeWidth="3" strokeLinecap="round"><polyline points="20 6 9 17 4 12"/></svg>
                  </div>
                  <div style={{textAlign:"center"}}>
                    <div style={{color:"#111",fontSize:12,fontWeight:700}}>Pix</div>
                    <div style={{color:"#111",fontSize:12,fontWeight:700}}>realizado!</div>
                    <div style={{color:"#888",fontSize:11,marginTop:2}}>{r.datetimeShort}</div>
                  </div>
                </div>
              </div>

              {/* Dest avatar + name */}
              <div style={{marginBottom:20}}>
                <div style={{width:44,height:44,borderRadius:22,background:"#e5e5e5",display:"flex",alignItems:"center",justifyContent:"center",marginBottom:8}}>
                  <span style={{color:"#555",fontSize:14,fontWeight:700}}>{r.destInitials}</span>
                </div>
                <div style={{color:"#111",fontSize:20,fontWeight:700,marginBottom:4}}>{r.destName}</div>
                <div style={{color:"#555",fontSize:13}}>Banco: {r.destBank}</div>
                <div style={{color:"#555",fontSize:13}}>Agência: {r.destAgencia}</div>
                <div style={{color:"#555",fontSize:13}}>Conta: {r.destConta}</div>
              </div>

              <div style={{height:1,background:"#e5e5e5",margin:"20px 0"}}/>

              {/* Transaction details */}
              <Row label="Código de autenticação" value={r.authCode}/>
              <Row label="ID da transação" value={r.txId}/>
              <Row label="CPF / CNPJ" value={r.destCnpj}/>
              <Row label="Valor" value={money(tx.amount)}/>
              <Row label="Data e hora da transação" value={r.datetime}/>

              <div style={{height:1,background:"#e5e5e5",margin:"20px 0"}}/>

              {/* Origin */}
              <div style={{color:"#111",fontSize:16,fontWeight:700,marginBottom:16}}>Conta de origem</div>
              <div style={{display:"flex",alignItems:"center",gap:0,marginBottom:12,position:"relative",width:52}}>
                <div style={{width:40,height:40,borderRadius:20,background:"#e5e5e5",display:"flex",alignItems:"center",justifyContent:"center"}}>
                  <span style={{color:"#555",fontSize:13,fontWeight:700}}>{r.originInitials}</span>
                </div>
                <div style={{width:18,height:18,borderRadius:9,background:"#111",display:"flex",alignItems:"center",justifyContent:"center",position:"absolute",bottom:0,left:24}}>
                  <span style={{color:C.wh,fontSize:8,fontWeight:900}}>c6</span>
                </div>
              </div>
              <div style={{color:"#111",fontSize:16,fontWeight:600,marginBottom:4}}>{r.originName}</div>
              <div style={{color:"#555",fontSize:13}}>Banco: {r.originBank}</div>
              <div style={{color:"#555",fontSize:13}}>Agência: {r.originAgencia}</div>
              <div style={{color:"#555",fontSize:13,marginBottom:24}}>Conta: {r.originConta}</div>

              <div style={{height:1,background:"#e5e5e5",margin:"0 0 20px"}}/>

              {/* Footer info */}
              <p style={{color:"#555",fontSize:13,lineHeight:1.6,marginBottom:12}}>
                Em caso de dúvidas ou se precisar de orientações, acesse o chat no app ou ligue para os telefones abaixo.<br/>
                <b>Você deverá informar o ID da transação que aparece nesse comprovante.</b>
              </p>
              <p style={{color:"#555",fontSize:13,lineHeight:1.6,marginBottom:20}}>
                <b>Central de Relacionamento</b> - segunda a sexta (exceto feriados): 8h às 23h
              </p>
              {[
                {label:"Capitais e regiões metropolitanas", num:"3003 6116"},
                {label:"Demais regiões", num:"0800 660 6116"},
                {label:"SAC (reclamações, cancelamentos, dúvidas, informações e sugestões) – atendimento 24h", num:"0800 660 0060"},
                {label:"Ouvidoria\nSegunda à sexta, exceto feriados, das 9h às 18h.", num:"0800 660 6060"},
              ].map(p=>(
                <div key={p.num} style={{marginBottom:16}}>

        setPrevScreen(screen);

        setNavAnim(dir === "forward" ? "anim-slide-right" : "anim-slide-left");
        setScreen(newScreen);
        setTimeout(() => setNavAnim(null), 380);
      }
      function goToSheet(newScreen) {
        setPrevScreen(screen);
        setTransDir("forward");
        setNavAnim("anim-sheet-up");
        setScreen(newScreen);
        setTimeout(() => setNavAnim(null), 400);
      }
      function goHome() {
        setPrevScreen(screen);
        setNavAnim("anim-fade-scale");
        setScreen("home");
        setTimeout(() => setNavAnim(null), 420);
      }
      function goBack() {
        if(receipt){ setReceipt(null); return; }
        if(fSheet){ setFSheet(false); return; }
        if(pixOpen){ setPixOpen(false); return; }
        if(iModal){ setIModal(false); return; }
        if(extrato){
          setNavAnim("anim-slide-left");
          setTimeout(()=>{ setExtrato(false); setNavAnim(null); }, 320);
          return;
        }
        if(screen==="pin"){   goTo("account","back"); return; }
        if(screen==="account"){ goTo("splash","back"); return; }
        if(nav!=="home"){ setNav("home"); return; }
      }

      function tapDigit(d){
        if(pinErr){setPin("");setPinErr(false);return;}
        const next=pin+d; setPin(next);

      function sendPix(){
        setPixDone(true);
        setTimeout(()=>{setPixDone(false);setPixStep(1);setPixKey("");setPixAmt("");setPixOpen(false);},2400);

          </div>
          <div className="scroll-area" style={{flex:1,overflowY:"auto",padding:"0 20px",WebkitOverflowScrolling:"touch"}}>
            {Object.keys(grouped).length===0?(
              <div style={{textAlign:"center",padding:"52px 24px"}}>
                <div style={{width:42,height:42,borderRadius:21,border:`1.5px solid ${C.gd}`,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px"}}><Icon name="info" size={22} color={C.gd}/></div>
                <p style={{color:C.gy,fontSize:14,lineHeight:1.65,margin:0}}>Não foi possível encontrar resultados. Tente aumentar o período da busca nos filtros ou realize movimentações na sua conta.</p>
              </div>
            ):Object.entries(grouped).map(([date,txs])=>(
              <div key={date}>
                <div style={{display:"flex",alignItems:"center",gap:10,padding:"18px 0 10px"}}>
                  <div style={{width:8,height:8,borderRadius:4,background:C.gd,flexShrink:0}}/>
                  <span style={{color:C.gy,fontSize:13}}>{date}</span>
                </div>
                {txs.map(tx=>(
                  <div key={tx.id} style={{paddingLeft:18,paddingBottom:22,cursor:"pointer"}} onClick={()=>{ setNavAnim("anim-slide-right"); setReceipt(tx); setTimeout(()=>setNavAnim(null),380); }}>
                    <div style={{color:C.gy,fontSize:12,marginBottom:6}}>{tx.cat}</div>
                    <div style={{display:"flex",alignItems:"center",gap:12}}>
                      <div style={{width:40,height:40,borderRadius:20,flexShrink:0,background:tx.type==="credit"?"linear-gradient(135deg,#059669,#10b981)":C.s2,border:`1px solid ${tx.type==="credit"?"rgba(16,185,129,0.4)":C.bd}`,display:"flex",alignItems:"center",justifyContent:"center"}}>
                        <Icon name={tx.type==="credit"?"dn":"clip"} size={18} color={tx.type==="credit"?C.wh:C.gy}/>
                      </div>
                      <div style={{flex:1}}><div style={{color:C.wh,fontSize:14,lineHeight:1.4}}>{tx.desc}</div></div>
                      <div style={{color:tx.type==="credit"?C.gn:C.wh,fontSize:15,fontWeight:600,whiteSpace:"nowrap"}}>{money(tx.amount)}</div>
                    </div>
                  </div>
                ))}
              </div>
            ))}
          </div>
        </div>
      );}

      // ── FILTER SHEET ───────────────────────────────────────
      function FilterSheet(){
        const [loc,setLoc]=useState(period);
        const [cats,setCats]=useState([]);
        const PERIODS=[{v:"15",l:"Últimos 15 dias"},{v:"30",l:"Últimos 30 dias"},{v:"60",l:"Últimos 60 dias"},{v:"90",l:"Últimos 90 dias"}];
        const CAT_LIST=["Comprovante","Pix","Pagamentos","Transferências","Open Finance","Investimento","C6Tag","Pagamento em lote","Pagar salários via Pix"];
        return(
          <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.75)",zIndex:80,display:"flex",alignItems:"flex-end"}}>
            <div className="scroll-area" style={{background:"#1a1a1a",borderRadius:"24px 24px 0 0",width:"100%",padding:"26px 24px 42px",maxHeight:"88%",overflowY:"auto",WebkitOverflowScrolling:"touch"}}>
              <p style={{color:C.wh,fontSize:22,fontWeight:700,marginBottom:22}}>Filtrar por</p>
              <p style={{color:C.wh,fontSize:15,fontWeight:700,marginBottom:12}}>Período</p>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:22}}>
                {PERIODS.map(p=>(
                  <button key={p.v} onClick={()=>setLoc(p.v)} style={{display:"flex",alignItems:"center",gap:8,background:"none",border:`1.5px solid ${loc===p.v?C.wh:C.bd}`,borderRadius:50,padding:"10px 14px",color:C.wh,fontSize:13,fontWeight:500,fontFamily:"inherit"}}>
                    <Icon name="cal" size={15} color={C.wh}/>{p.l}
                  </button>
                ))}
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:18}}>
                {["De","Até"].map(l=>(
                  <div key={l} style={{borderBottom:`1px solid ${C.bd}`,paddingBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{color:C.gy,fontSize:15}}>{l}</span><Icon name="cal" size={18} color={C.gy}/>
                  </div>
                ))}
              </div>
              <div style={{background:"rgba(37,99,235,0.09)",border:`1.5px solid ${C.bl}`,borderRadius:14,padding:"14px 16px",marginBottom:24}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}><Icon name="info" size={18} color={C.bl}/><span style={{color:C.wh,fontSize:14,fontWeight:700}}>Informação</span></div>
                <p style={{color:C.gy,fontSize:13,lineHeight:1.55,margin:0}}>Você consegue consultar qualquer período de 0 dias entre a data inicial e final. Para períodos maiores, acesse "Exportar extrato".</p>
              </div>
              <p style={{color:C.wh,fontSize:15,fontWeight:700,marginBottom:12}}>Categorias</p>
              <div style={{display:"flex",flexWrap:"wrap",gap:10,marginBottom:30}}>
                {CAT_LIST.map(ct=>(
                  <button key={ct} onClick={()=>setCats(prev=>prev.includes(ct)?prev.filter(x=>x!==ct):[...prev,ct])} style={{background:"none",border:`1.5px solid ${cats.includes(ct)?C.wh:C.bd}`,borderRadius:50,padding:"8px 16px",color:C.wh,fontSize:13,fontWeight:500,fontFamily:"inherit"}}>{ct}</button>
                ))}
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                <button onClick={()=>setFSheet(false)} style={{background:"none",border:`1.5px solid ${C.bd}`,borderRadius:14,padding:"15px",color:C.wh,fontWeight:700,fontSize:15,fontFamily:"inherit"}}>Cancelar</button>
                <button onClick={()=>{setPeriod(loc);setFSheet(false);}} style={{background:"none",border:"none",padding:"15px",color:loc!==period||cats.length>0?C.wh:C.gd,fontWeight:700,fontSize:15,fontFamily:"inherit"}}>Filtrar</button>

          </div>

      // ── PIX MODAL ──────────────────────────────────────────
      function PixModal(){return(
        <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.85)",zIndex:70,display:"flex",alignItems:"flex-end"}}>
          <div style={{background:C.s1,borderRadius:"24px 24px 0 0",width:"100%",padding:"24px 24px 44px",border:`1px solid ${C.bd}`}}>
            <div style={{width:40,height:4,borderRadius:2,background:C.bd,margin:"0 auto 22px"}}/>
            {pixDone?(
              <div style={{textAlign:"center",padding:"36px 0"}}><div style={{fontSize:56,marginBottom:14}}>✅</div><p style={{color:C.wh,fontSize:20,fontWeight:800,margin:0}}>Pix enviado!</p></div>
            ):(
              <>
                <p style={{color:C.wh,fontSize:18,fontWeight:700,marginBottom:20}}>{pixStep===1?"Para quem vai?":"Qual o valor?"}</p>
                <div style={{display:"flex",gap:6,marginBottom:22}}>{[1,2].map(s=><div key={s} style={{flex:1,height:3,borderRadius:2,background:s<=pixStep?C.bl:C.bd}}/>)}</div>
                {pixStep===1&&(<>
                  <p style={{color:C.gy,fontSize:11,fontWeight:700,letterSpacing:0.9,textTransform:"uppercase",marginBottom:8}}>Chave Pix</p>

                    <BtnGhost onClick={()=>setPixOpen(false)} style={{flex:1}}>Cancelar</BtnGhost>

                    <p style={{color:C.gy,fontSize:11,marginBottom:4}}>Enviando para</p>
                    <p style={{color:C.wh,fontSize:15,fontWeight:700,margin:0}}>{pixKey}</p>
                  </div>
                  <p style={{color:C.gy,fontSize:11,fontWeight:700,letterSpacing:0.9,textTransform:"uppercase",marginBottom:8}}>Valor</p>

                  <div style={{display:"flex",gap:10}}>
                    <BtnGhost onClick={()=>setPixStep(1)} style={{flex:1}}>← Voltar</BtnGhost>
                    {pixAmt&&<BtnPrimary onClick={sendPix} style={{flex:2}}>Confirmar Pix</BtnPrimary>}

      // ── INVEST MODAL ───────────────────────────────────────

        <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.85)",zIndex:70,display:"flex",alignItems:"flex-end"}}>
          <div style={{background:C.s1,borderRadius:"24px 24px 0 0",width:"100%",padding:"24px 24px 44px",border:`1px solid ${C.bd}`}}>
            <div style={{width:40,height:4,borderRadius:2,background:C.bd,margin:"0 auto 22px"}}/>
            <p style={{color:C.wh,fontSize:18,fontWeight:700,marginBottom:6}}>Investir no CDB C6</p>
            <p style={{color:C.gy,fontSize:13,marginBottom:20}}>12,5% a.a. · Risco baixo</p>
            <input type="number" value={iVal} onChange={e=>setIVal(e.target.value)} placeholder="R$ 0,00" style={inputSt({fontSize:28,fontWeight:800,marginBottom:16})} autoFocus/>

              <BtnGhost onClick={()=>setIModal(false)} style={{flex:1}}>Cancelar</BtnGhost>

      // ── CARDS / INVEST / MENU ──────────────────────────────
      function CardsScreen(){return(
        <div style={{padding:"0 20px"}}>

          <div style={{background:"linear-gradient(140deg,#1e1e1e,#2d2d2d)",borderRadius:22,padding:28,border:"1px solid #3a3a3a",marginBottom:20}}>
            <p style={{color:C.wh,fontSize:17,fontWeight:900,letterSpacing:1,marginBottom:36}}>C6 Bank</p>
            <p style={{color:"#bbb",fontSize:16,fontWeight:700,letterSpacing:4,marginBottom:24,fontFamily:"monospace"}}>•••• •••• •••• 7293</p>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end"}}>
              <div><p style={{color:C.gd,fontSize:9,marginBottom:3}}>TITULAR</p><p style={{color:C.wh,fontSize:12,fontWeight:800}}>EVANDRO LUCAS</p></div>
              <div><p style={{color:C.gd,fontSize:9,marginBottom:3}}>VALIDADE</p><p style={{color:C.wh,fontSize:12,fontWeight:800}}>09/29</p></div>
              <span style={{color:C.gy,fontSize:28}}>◉◎</span>
            </div>
          </div>
          <div style={{background:C.s1,borderRadius:14,padding:16,border:`1px solid ${C.bd}`}}>
            <p style={{color:C.gy,fontSize:12,marginBottom:3}}>Fatura atual</p>
            <p style={{color:C.wh,fontSize:22,fontWeight:800}}>R$ 0,00</p>
            <p style={{color:C.gd,fontSize:11,marginTop:3}}>Sem fatura em aberto</p>
          </div>
        </div>
      );}

      function InvestScreen(){return(
        <div style={{padding:"0 20px"}}>
          <p style={{color:C.wh,fontSize:20,fontWeight:800,marginBottom:20}}>C6 Invest</p>
          <div style={{background:C.s1,borderRadius:20,padding:20,border:`1px solid ${C.bd}`,marginBottom:16}}>
            <p style={{color:C.gy,fontSize:11,fontWeight:700,letterSpacing:1,textTransform:"uppercase",marginBottom:6}}>Patrimônio investido</p>
            <p style={{color:C.wh,fontSize:32,fontWeight:900,letterSpacing:-1,marginBottom:6}}>{money(invested)}</p>
            <p style={{color:C.gn,fontSize:13,fontWeight:700}}>▲ +3,87% este mês</p>
          </div>
          {[{n:"CDB C6 Bank",r:"12,5% a.a.",p:48},{n:"Tesouro IPCA+",r:"IPCA+5,8%",p:31},{n:"Fundo RF C6",r:"11,2% a.a.",p:21}].map(a=>(
            <div key={a.n} style={{background:C.s1,borderRadius:14,padding:14,border:`1px solid ${C.bd}`,marginBottom:8}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}><span style={{color:C.wh,fontSize:13,fontWeight:700}}>{a.n}</span><span style={{color:"#60a5fa",fontSize:13,fontWeight:800}}>{a.r}</span></div>
              <div style={{height:3,borderRadius:3,background:C.bd}}><div style={{height:3,borderRadius:3,width:`${a.p}%`,background:"linear-gradient(90deg,#2563eb,#60a5fa)"}}/></div>
            </div>
          ))}
          <button onClick={()=>setIModal(true)} style={{background:C.bl,border:"none",borderRadius:14,padding:14,color:C.wh,fontWeight:800,fontSize:15,width:"100%",marginTop:8,fontFamily:"inherit"}}>Investir agora</button>
        </div>
      );}

      function MenuScreen(){return(
        <div style={{padding:"0 20px"}}>
          <p style={{color:C.wh,fontSize:20,fontWeight:800,marginBottom:20}}>Menu</p>

            <button key={l} onClick={()=>showToast(l+" em breve")} style={{background:C.s1,border:`1px solid ${C.bd}`,borderRadius:14,padding:"15px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",width:"100%",marginBottom:8,fontFamily:"inherit"}}>

                <div style={{width:36,height:36,borderRadius:10,background:C.s2,display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name={n} size={18} color={C.gy}/></div>
                <span style={{color:C.wh,fontSize:14,fontWeight:600}}>{l}</span>
              </div>
              <Icon name="chR" size={18} color={C.gd}/>
            </button>

      // ── BOTTOM NAV ─────────────────────────────────────────
      function BottomNav(){
        const items=[
          {id:"home",label:"Início",icon:"home"},
          {id:"cards",label:"Cartões",icon:"cards"},
          {id:"asst",label:"C6 Assistant",icon:null},
          {id:"invest",label:"C6 Invest",icon:"chart"},
          {id:"menu",label:"Menu",icon:"menu"},
        ];
        return(
          <div style={{position:"absolute",bottom:0,left:0,right:0,background:"#161616",borderTop:`1px solid ${C.bd}`,display:"flex",justifyContent:"space-around",alignItems:"center",padding:"10px 0 16px"}}>
            {items.map(it=>(
              <button key={it.id} onClick={()=>{if(it.id==="asst"){showToast("C6 Assistant em breve!");return;}setNav(it.id);}} style={{background:"none",border:"none",display:"flex",flexDirection:"column",alignItems:"center",gap:4,padding:"4px 10px",fontFamily:"inherit"}}>
                {it.icon===null
                  ?<div style={{width:46,height:46,borderRadius:23,background:"radial-gradient(circle at 38% 38%,#7ec8fa,#1a4ed8)",boxShadow:"0 0 18px rgba(59,130,246,0.55)",marginBottom:2}}/>
                  :<Icon name={it.icon} size={24} color={nav===it.id?C.wh:C.gd}/>
                }
                <span style={{fontSize:10,fontWeight:600,color:nav===it.id&&it.icon!==null?C.wh:C.gd}}>{it.label}</span>
                {nav===it.id&&it.icon!==null&&<div style={{width:18,height:2.5,borderRadius:2,background:C.yw,marginTop:-2}}/>}
              </button>
            ))}
          </div>
        );
      }

      // ── RENDER ─────────────────────────────────────────────
      return (
        <div style={{height:"100%",background:C.bg,fontFamily:"-apple-system,'Helvetica Neue',Arial,sans-serif",display:"flex",flexDirection:"column",overflow:"hidden"}}>
          {toast&&(
            <div style={{position:"fixed",top:16,left:16,right:16,background:C.bl,color:C.wh,borderRadius:14,padding:"12px 18px",fontSize:13,fontWeight:600,zIndex:300,animation:"toastIn 0.25s ease",textAlign:"center",boxShadow:"0 8px 32px rgba(37,99,235,0.4)"}}>
              {toast}
            </div>
          )}

          <div className={navAnim || ""} style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",position:"relative"}}>
          {screen==="splash"  && <SplashScreen/>}
          {screen==="account" && <AccountScreen/>}
          {screen==="pin"     && <PinScreen/>}

          {screen==="home"&&(
            <>
              <div className="scroll-area" style={{flex:1,overflowY:"auto",paddingBottom:extrato?0:80,WebkitOverflowScrolling:"touch"}}>
                {extrato
                  ?<ExtratoScreen/>
                  :nav==="home"   ?<HomeScreen/>
                  :nav==="cards"  ?<CardsScreen/>
                  :nav==="invest" ?<InvestScreen/>
                  :<MenuScreen/>}
              </div>
              {pixOpen&&<PixModal/>}
              {iModal&&<InvestModal/>}
              {fSheet&&<FilterSheet/>}
              {!extrato&&<BottomNav/>}
            </>
          )}

          {/* RECEIPT overlay */}
          {receipt&&<Receipt tx={receipt} onClose={()=>{ setNavAnim("anim-slide-left"); setTimeout(()=>{ setReceipt(null); setNavAnim(null); },320); }}/>}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(C6App));
  </script>

  <script>
    // Swipe navigation: right swipe = go back
    (function(){
      let startX = 0, startY = 0;
      const THRESHOLD = 80;
      const EDGE = 60; // must start within 60px of left edge

      document.addEventListener('touchstart', function(e){
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, {passive: true});

      document.addEventListener('touchend', function(e){
        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;
        // Right swipe from left edge
        if(dx > THRESHOLD && Math.abs(dy) < 80 && startX < EDGE){
          // Dispatch custom back event
          window.dispatchEvent(new CustomEvent('swipe-back'));
        }
      }, {passive: true});
    })();
  </script>
</body>
