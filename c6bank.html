// ═══════════════════════════════════════════════════════════
function C6App() {
  const [screen,  setScreen]  = useState("splash");
  const [nav,     setNav]     = useState("home");
  const [pin,     setPin]     = useState("");
  const [pinErr,  setPinErr]  = useState(false);
  const [visible, setVisible] = useState(false);
  const [toast,   setToast]   = useState(null);
  const [extrato, setExtrato] = useState(false);
  const [fSheet,  setFSheet]  = useState(false);
  const [period,  setPeriod]  = useState("30");
  const [srch,    setSrch]    = useState("");
  const [pixOpen, setPixOpen] = useState(false);
  const [pixStep, setPixStep] = useState(1);
  const [pixKey,  setPixKey]  = useState("");
  const [pixAmt,  setPixAmt]  = useState("");
  const [pixDone, setPixDone] = useState(false);
  const [invested,setInvested]= useState(32227.20);
  const [iModal,  setIModal]  = useState(false);
  const [iVal,    setIVal]    = useState("");

  const BALANCE = 0;
  const ATOMOS  = 12480;

  function showToast(m) {
    setToast(m);
    setTimeout(() => setToast(null), 3000);
  }

  // ── PIN logic ──────────────────────────────────────────
  function tapDigit(d) {
    if (pinErr) { setPin(""); setPinErr(false); return; }
    const next = pin + d;
    setPin(next);
    if (next.length === 6) {
      if (next === "919396") {
        setTimeout(() => { setPin(""); setScreen("home"); }, 300);
      } else {
        setPinErr(true);
        setTimeout(() => { setPin(""); setPinErr(false); }, 1400);
      }
    }
  }
  function backspace() { setPin(p => p.slice(0, -1)); }

  // ── TX grouping ────────────────────────────────────────
  const rawTxs = period === "60" ? TX60 : TX30;
  const filtTxs = srch
    ? rawTxs.filter(t => t.desc.toLowerCase().includes(srch.toLowerCase()))
    : rawTxs;
  const grouped = {};
  filtTxs.forEach(t => {
    if (!grouped[t.group]) grouped[t.group] = [];
    grouped[t.group].push(t);
  });

  // ── Pix send ───────────────────────────────────────────
  function sendPix() {
    setPixDone(true);
    setTimeout(() => {
      setPixDone(false); setPixStep(1);
      setPixKey(""); setPixAmt(""); setPixOpen(false);
    }, 2400);
  }

  // ── Invest ─────────────────────────────────────────────
  function doInvest() {
    const a = parseFloat(iVal);
    if (!isNaN(a) && a > 0) {
      setInvested(i => i + a);
      showToast(money(a) + " investidos!");
    }
    setIVal(""); setIModal(false);
  }

              {pixStep === 1 && (
                <>
                  <p style={{ color: C.gy, fontSize: 11, fontWeight: 700, letterSpacing: 0.9, textTransform: "uppercase", marginBottom: 8 }}>Chave Pix</p>
                  <input value={pixKey} onChange={e => setPixKey(e.target.value)}
                    placeholder="CPF, CNPJ, e-mail, telefone"
                    style={inputSt({ marginBottom: 16 })} autoFocus />
                  <div style={{ display: "flex", gap: 10 }}>
                    <BtnGhost onClick={() => setPixOpen(false)} style={{ flex: 1 }}>Cancelar</BtnGhost>
                    {pixKey && <BtnPrimary onClick={() => setPixStep(2)} style={{ flex: 2 }}>Continuar →</BtnPrimary>}
                  </div>
                </>
              )}

              {pixStep === 2 && (
                <>
                  <div style={{ background: C.s2, borderRadius: 12, padding: 14, border: `1px solid ${C.bd}`, marginBottom: 16 }}>
                    <p style={{ color: C.gy, fontSize: 11, marginBottom: 4 }}>Enviando para</p>
                    <p style={{ color: C.wh, fontSize: 15, fontWeight: 700, margin: 0 }}>{pixKey}</p>
                  </div>
                  <p style={{ color: C.gy, fontSize: 11, fontWeight: 700, letterSpacing: 0.9, textTransform: "uppercase", marginBottom: 8 }}>Valor</p>
                  <input type="number" value={pixAmt} onChange={e => setPixAmt(e.target.value)}
                    placeholder="0,00" style={inputSt({ fontSize: 28, fontWeight: 800, marginBottom: 16 })} autoFocus />
                  <div style={{ display: "flex", gap: 10 }}>
                    <BtnGhost onClick={() => setPixStep(1)} style={{ flex: 1 }}>← Voltar</BtnGhost>
                    {pixAmt && <BtnPrimary onClick={sendPix} style={{ flex: 2 }}>Confirmar Pix</BtnPrimary>}
                  </div>
                </>
              )}
            </>
          )}
        </div>
      </div>
    );
  }

  // ── INVEST MODAL ────────────────────────────────────────
  function InvestModal() {
    return (
      <div style={{ position: "absolute", inset: 0, background: "rgba(0,0,0,0.85)", zIndex: 70, display: "flex", alignItems: "flex-end" }}>
        <div style={{ background: C.s1, borderRadius: "24px 24px 0 0", width: "100%", padding: "24px 24px 44px", border: `1px solid ${C.bd}` }}>
          <div style={{ width: 40, height: 4, borderRadius: 2, background: C.bd, margin: "0 auto 22px" }} />
          <p style={{ color: C.wh, fontSize: 18, fontWeight: 700, marginBottom: 6 }}>Investir no CDB C6</p>
          <p style={{ color: C.gy, fontSize: 13, marginBottom: 20 }}>12,5% a.a. · Risco baixo</p>
          <input type="number" value={iVal} onChange={e => setIVal(e.target.value)}
            placeholder="R$ 0,00" style={inputSt({ fontSize: 28, fontWeight: 800, marginBottom: 16 })} autoFocus />
          <div style={{ display: "flex", gap: 10 }}>
            <BtnGhost onClick={() => setIModal(false)} style={{ flex: 1 }}>Cancelar</BtnGhost>
            {iVal && <BtnPrimary onClick={doInvest} style={{ flex: 2 }}>Investir →</BtnPrimary>}
          </div>
        </div>
      </div>
    );
  }

  // ── OTHER NAV SCREENS ───────────────────────────────────
  function CardsScreen() {
    return (
      <div style={{ padding: "0 20px" }}>
        <p style={{ color: C.wh, fontSize: 20, fontWeight: 800, marginBottom: 20 }}>Cartões</p>
        <div style={{ background: "linear-gradient(140deg,#1e1e1e,#2d2d2d)", borderRadius: 22, padding: 28, border: "1px solid #3a3a3a", marginBottom: 20 }}>
          <p style={{ color: C.wh, fontSize: 17, fontWeight: 900, letterSpacing: 1, marginBottom: 36 }}>C6 Bank</p>
          <p style={{ color: "#bbb", fontSize: 16, fontWeight: 700, letterSpacing: 4, marginBottom: 24, fontFamily: "monospace" }}>•••• •••• •••• 7293</p>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end" }}>
            <div><p style={{ color: C.gd, fontSize: 9, marginBottom: 3 }}>TITULAR</p><p style={{ color: C.wh, fontSize: 12, fontWeight: 800 }}>EVANDRO LUCAS</p></div>
            <div><p style={{ color: C.gd, fontSize: 9, marginBottom: 3 }}>VALIDADE</p><p style={{ color: C.wh, fontSize: 12, fontWeight: 800 }}>09/29</p></div>
            <span style={{ color: C.gy, fontSize: 28 }}>◉◎</span>
          </div>
        </div>
        <div style={{ background: C.s1, borderRadius: 14, padding: 16, border: `1px solid ${C.bd}` }}>
          <p style={{ color: C.gy, fontSize: 12, marginBottom: 3 }}>Fatura atual</p>
          <p style={{ color: C.wh, fontSize: 22, fontWeight: 800 }}>R$ 0,00</p>
          <p style={{ color: C.gd, fontSize: 11, marginTop: 3 }}>Sem fatura em aberto</p>
        </div>
      </div>
    );
  }

  function InvestScreen() {
    return (
      <div style={{ padding: "0 20px" }}>
        <p style={{ color: C.wh, fontSize: 20, fontWeight: 800, marginBottom: 20 }}>C6 Invest</p>
        <div style={{ background: C.s1, borderRadius: 20, padding: 20, border: `1px solid ${C.bd}`, marginBottom: 16 }}>
          <p style={{ color: C.gy, fontSize: 11, fontWeight: 700, letterSpacing: 1, textTransform: "uppercase", marginBottom: 6 }}>Patrimônio investido</p>
          <p style={{ color: C.wh, fontSize: 32, fontWeight: 900, letterSpacing: -1, marginBottom: 6 }}>{money(invested)}</p>
          <p style={{ color: C.gn, fontSize: 13, fontWeight: 700 }}>▲ +3,87% este mês</p>
        </div>
        {[
          { n: "CDB C6 Bank", r: "12,5% a.a.", v: 15469.06, p: 48 },
          { n: "Tesouro IPCA+", r: "IPCA+5,8%", v: 9990.43, p: 31 },
          { n: "Fundo RF C6", r: "11,2% a.a.", v: 6767.71, p: 21 },
        ].map(a => (
          <div key={a.n} style={{ background: C.s1, borderRadius: 14, padding: 14, border: `1px solid ${C.bd}`, marginBottom: 8 }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
              <span style={{ color: C.wh, fontSize: 13, fontWeight: 700 }}>{a.n}</span>
              <span style={{ color: "#60a5fa", fontSize: 13, fontWeight: 800 }}>{a.r}</span>
            </div>
            <div style={{ height: 3, borderRadius: 3, background: C.bd }}>
              <div style={{ height: 3, borderRadius: 3, width: `${a.p}%`, background: "linear-gradient(90deg,#2563eb,#60a5fa)" }} />
            </div>
          </div>
        ))}
        <button onClick={() => setIModal(true)} style={{ background: C.bl, border: "none", borderRadius: 14, padding: 14, color: C.wh, fontWeight: 800, fontSize: 15, cursor: "pointer", width: "100%", marginTop: 8, fontFamily: "inherit" }}>
          Investir agora
        </button>
      </div>
    );
  }

  function MenuScreen() {
    return (
      <div style={{ padding: "0 20px" }}>
        <p style={{ color: C.wh, fontSize: 20, fontWeight: 800, marginBottom: 20 }}>Menu</p>
        {[["Pix","pix"],["Transferir","swap"],["Pagar","scan"],["Empréstimo","loan"],["Recarga de celular","phone"]].map(([l, n]) => (
          <button key={l} onClick={() => showToast(l + " em breve")}
            style={{ background: C.s1, border: `1px solid ${C.bd}`, borderRadius: 14, padding: "15px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", width: "100%", marginBottom: 8, cursor: "pointer", fontFamily: "inherit" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
              <div style={{ width: 36, height: 36, borderRadius: 10, background: C.s2, display: "flex", alignItems: "center", justifyContent: "center" }}>
                <Icon name={n} size={18} color={C.gy} />
              </div>
              <span style={{ color: C.wh, fontSize: 14, fontWeight: 600 }}>{l}</span>
            </div>
            <Icon name="chR" size={18} color={C.gd} />
          </button>
        ))}
      </div>
    );
  }

  // ── BOTTOM NAV ──────────────────────────────────────────
  function BottomNav() {
    const items = [
      { id: "home",   label: "Início",       icon: "home" },
      { id: "cards",  label: "Cartões",       icon: "cards" },
      { id: "asst",   label: "C6 Assistant",  icon: null },
      { id: "invest", label: "C6 Invest",     icon: "chart" },
      { id: "menu",   label: "Menu",          icon: "menu" },
    ];
    return (
      <div style={{ position: "absolute", bottom: 0, left: 0, right: 0, background: "#161616", borderTop: `1px solid ${C.bd}`, display: "flex", justifyContent: "space-around", alignItems: "center", padding: "10px 0 30px" }}>
        {items.map(it => (
          <button key={it.id}
            onClick={() => { if (it.id === "asst") { showToast("C6 Assistant em breve!"); return; } setNav(it.id); }}
            style={{ background: "none", border: "none", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 4, padding: "4px 10px", fontFamily: "inherit" }}>
            {it.icon === null
              ? <div style={{ width: 46, height: 46, borderRadius: 23, background: "radial-gradient(circle at 38% 38%,#7ec8fa,#1a4ed8)", boxShadow: "0 0 18px rgba(59,130,246,0.55)", marginBottom: 2 }} />
              : <Icon name={it.icon} size={24} color={nav === it.id ? C.wh : C.gd} />
            }
            <span style={{ fontSize: 10, fontWeight: 600, color: nav === it.id && it.icon !== null ? C.wh : C.gd }}>{it.label}</span>
            {nav === it.id && it.icon !== null && <div style={{ width: 18, height: 2.5, borderRadius: 2, background: C.yw, marginTop: -2 }} />}
          </button>
        ))}
      </div>
    );
  }

  // ═══ RENDER ═════════════════════════════════════════════
  return (
    <div style={{ minHeight: "100vh", background: C.bg, fontFamily: "-apple-system,'Helvetica Neue',Arial,sans-serif" }}>
      <style>{`
        * { box-sizing: border-box; margin: 0; padding: 0; }
        ::-webkit-scrollbar { display: none; }
        input::placeholder { color: #48484A; }
        input:focus { border-color: #2563EB !important; outline: none; }
        button { font-family: inherit; }
        @keyframes toastIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
      `}</style>

      {/* Full screen app */}
      <div style={{
        width: "100%",
        minHeight: "100vh",
        background: C.bg,
        position: "relative",
        display: "flex",
        flexDirection: "column",
      }}>
        <StatusBar time="22:50" />

        {/* Toast */}
        {toast && (
          <div style={{ position: "absolute", top: 54, left: 16, right: 16, background: C.bl, color: C.wh, borderRadius: 14, padding: "12px 18px", fontSize: 13, fontWeight: 600, zIndex: 300, animation: "toastIn 0.25s ease", textAlign: "center", boxShadow: "0 8px 32px rgba(37,99,235,0.4)" }}>
            {toast}
          </div>
        )}

        {/* Login flow */}
        {screen === "splash"  && <SplashScreen />}
        {screen === "account" && <AccountScreen />}
        {screen === "pin"     && <PinScreen />}

        {/* App */}
        {screen === "home" && (
          <>
            <div style={{ flex: 1, overflowY: "auto", paddingBottom: extrato ? 0 : 88, scrollbarWidth: "none" }}>
              {extrato
                ? <ExtratoScreen />
                : nav === "home"   ? <HomeScreen />
                : nav === "cards"  ? <CardsScreen />
                : nav === "invest" ? <InvestScreen />
                : <MenuScreen />}
            </div>

            {pixOpen && <PixModal />}
            {iModal  && <InvestModal />}
            {fSheet  && <FilterSheet />}
            {!extrato && <BottomNav />}
          </>
        )}
      </div>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(C6App));
  </script>
</body>
</html>
