    </div>
  );}

  function CardsScreen(){return(<div style={{padding:"0 20px"}}><p style={{color:C.wh,fontSize:20,fontWeight:800,marginBottom:20}}>Cartões</p><div style={{background:"linear-gradient(140deg,#1e1e1e,#2d2d2d)",borderRadius:22,padding:28,border:"1px solid #3a3a3a",marginBottom:20}}><p style={{color:C.wh,fontSize:17,fontWeight:900,letterSpacing:1,marginBottom:36}}>C6 Bank</p><p style={{color:"#bbb",fontSize:16,fontWeight:700,letterSpacing:4,marginBottom:24,fontFamily:"monospace"}}>•••• •••• •••• 7293</p><div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end"}}><div><p style={{color:C.gd,fontSize:9,marginBottom:3}}>TITULAR</p><p style={{color:C.wh,fontSize:12,fontWeight:800}}>EVANDRO LUCAS</p></div><div><p style={{color:C.gd,fontSize:9,marginBottom:3}}>VALIDADE</p><p style={{color:C.wh,fontSize:12,fontWeight:800}}>09/29</p></div><span style={{color:C.gy,fontSize:28}}>◉◎</span></div></div><div style={{background:C.s1,borderRadius:14,padding:16,border:`1px solid ${C.bd}`}}><p style={{color:C.gy,fontSize:12,marginBottom:3}}>Fatura atual</p><p style={{color:C.wh,fontSize:22,fontWeight:800}}>R$ 0,00</p><p style={{color:C.gd,fontSize:11,marginTop:3}}>Sem fatura em aberto</p></div></div>);}

  function InvestScreen(){return(<div style={{padding:"0 20px"}}><p style={{color:C.wh,fontSize:20,fontWeight:800,marginBottom:20}}>C6 Invest</p><div style={{background:C.s1,borderRadius:20,padding:20,border:`1px solid ${C.bd}`,marginBottom:16}}><p style={{color:C.gy,fontSize:11,fontWeight:700,letterSpacing:1,textTransform:"uppercase",marginBottom:6}}>Patrimônio investido</p><p style={{color:C.wh,fontSize:32,fontWeight:900,letterSpacing:-1,marginBottom:6}}>{money(invested)}</p><p style={{color:C.gn,fontSize:13,fontWeight:700}}>▲ +3,87% este mês</p></div>{[{n:"CDB C6 Bank",r:"12,5% a.a.",p:48},{n:"Tesouro IPCA+",r:"IPCA+5,8%",p:31},{n:"Fundo RF C6",r:"11,2% a.a.",p:21}].map(a=>(<div key={a.n} style={{background:C.s1,borderRadius:14,padding:14,border:`1px solid ${C.bd}`,marginBottom:8}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}><span style={{color:C.wh,fontSize:13,fontWeight:700}}>{a.n}</span><span style={{color:"#60a5fa",fontSize:13,fontWeight:800}}>{a.r}</span></div><div style={{height:3,borderRadius:3,background:C.bd}}><div style={{height:3,borderRadius:3,width:`${a.p}%`,background:"linear-gradient(90deg,#2563eb,#60a5fa)"}}/></div></div>))}<button onClick={()=>setIModal(true)} style={{background:C.bl,border:"none",borderRadius:14,padding:14,color:C.wh,fontWeight:800,fontSize:15,width:"100%",marginTop:8,fontFamily:"inherit"}}>Investir agora</button></div>);}

  function MenuScreen(){return(<div style={{padding:"0 20px"}}><p style={{color:C.wh,fontSize:20,fontWeight:800,marginBottom:20}}>Menu</p>{[["Pix","pix"],["Transferir","swap"],["Pagar","scan"],["Empréstimo","loan"],["Recarga de celular","phone"]].map(([l,n])=>(<button key={l} onClick={()=>t_(l+" em breve")} style={{background:C.s1,border:`1px solid ${C.bd}`,borderRadius:14,padding:"15px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",width:"100%",marginBottom:8,fontFamily:"inherit"}}><div style={{display:"flex",alignItems:"center",gap:14}}><div style={{width:36,height:36,borderRadius:10,background:C.s2,display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name={n} size={18} color={C.gy}/></div><span style={{color:C.wh,fontSize:14,fontWeight:600}}>{l}</span></div><Icon name="chR" size={18} color={C.gd}/></button>))}</div>);}

  function BottomNav(){
    return(<div style={{position:"absolute",bottom:0,left:0,right:0,background:"#161616",borderTop:`1px solid ${C.bd}`,display:"flex",justifyContent:"space-around",alignItems:"center",padding:"10px 0 16px"}}>
      {[{id:"home",label:"Início",icon:"home"},{id:"cards",label:"Cartões",icon:"cards"},{id:"asst",label:"C6 Assistant",icon:null},{id:"invest",label:"C6 Invest",icon:"chart"},{id:"menu",label:"Menu",icon:"dots"}].map(it=>(
        <button key={it.id} onClick={()=>{if(it.id==="asst"){t_("C6 Assistant em breve!");return;}setNav(it.id);}} style={{background:"none",border:"none",display:"flex",flexDirection:"column",alignItems:"center",gap:4,padding:"4px 10px",fontFamily:"inherit"}}>
          {it.icon===null?<div style={{width:46,height:46,borderRadius:23,background:"radial-gradient(circle at 38% 38%,#7ec8fa,#1a4ed8)",boxShadow:"0 0 18px rgba(59,130,246,.55)",marginBottom:2}}/>:<Icon name={it.icon} size={24} color={nav===it.id?C.wh:C.gd}/>}
          <span style={{fontSize:10,fontWeight:600,color:nav===it.id&&it.icon!==null?C.wh:C.gd}}>{it.label}</span>
          {nav===it.id&&it.icon!==null&&<div style={{width:18,height:2.5,borderRadius:2,background:C.yw,marginTop:-2}}/>}
        </button>
      ))}
    </div>);
  }

  return(
    <div style={{height:"100%",background:C.bg,fontFamily:"-apple-system,'Helvetica Neue',Arial,sans-serif",display:"flex",flexDirection:"column",overflow:"hidden"}}>
      {toast&&(<div style={{position:"fixed",top:16,left:16,right:16,background:C.bl,color:C.wh,borderRadius:14,padding:"12px 18px",fontSize:13,fontWeight:600,zIndex:300,animation:"toastIn .25s ease",textAlign:"center",boxShadow:"0 8px 32px rgba(37,99,235,.4)"}}>{toast}</div>)}
      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",position:"relative"}}>
        {screen==="splash"&&<SplashScreen/>}
        {screen==="account"&&<AccountScreen/>}
        {screen==="pin"&&<PinScreen/>}
        {screen==="home"&&(
          <>
            <div className="sa" style={{flex:1,overflowY:"auto",paddingBottom:extrato?0:80}}>
              {extrato?<ExtratoScreen/>:nav==="home"?<HomeScreen/>:nav==="cards"?<CardsScreen/>:nav==="invest"?<InvestScreen/>:<MenuScreen/>}
            </div>
            {pixOpen&&<PixModal/>}
            {iModal&&<InvestModal/>}
            {fSheet&&<FilterSheet/>}
            {!extrato&&<BottomNav/>}
          </>
        )}
      </div>
      {receipt&&<Receipt tx={receipt} onClose={()=>{setTimeout(()=>{setReceipt(null);},340);}}/>}
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(C6App));
</script>
</body>
</html>
